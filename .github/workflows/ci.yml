name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Go test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: go build ./...

  sonar:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check SonarCloud configuration
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.sonar-config.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: steps.sonar-config.outputs.enabled == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate Go coverage report
        if: steps.sonar-config.outputs.enabled == 'true'
        run: go test -coverprofile=coverage.out ./...
      - uses: SonarSource/sonarqube-scan-action@v5
        if: steps.sonar-config.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=upfera
            -Dsonar.projectKey=upfera_gh-upfera
